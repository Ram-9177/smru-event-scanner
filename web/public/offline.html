<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#170A09" />
    <title>Event photos</title>
    <style>
      /* The red-lit darkroom, offline: system fonts only (nothing else can load). An empty print on the drying line. */
      :root { color-scheme: dark; --room: #170a09; --paper: #f4eee3; --paper-2: #e6d9c8; --ink: #1b1210; --muted: #6b5b52; --light: #f4eee3; --light-muted: #c9b8ae; --red: #ff4a36; --red-h: #ff5f4c; --pencil: #e8301c; --amber: #ffb224; --peg: #c99b6b; --peg-2: #a87a4c; --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; color: var(--light); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(120% 70% at 85% 0%, rgba(255, 74, 54, 0.22), transparent 60%), var(--room); }
      main { width: 100%; max-width: 360px; text-align: center; }
      .lamp { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 18px 6px rgba(255, 74, 54, 0.45); vertical-align: middle; margin-right: 10px; }
      .edge { font: 700 13px/1 var(--cond); letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); }
      .line { position: relative; height: 2px; margin: 28px -16px 0; background: #b39a8e; opacity: 0.8; }
      .print { position: relative; width: 200px; margin: -4px auto 0; padding: 12px 12px 34px; background: var(--paper); border-radius: 3px; box-shadow: 0 18px 30px rgba(0, 0, 0, 0.5); transform: rotate(-2deg); }
      .print::before { content: ""; position: absolute; left: 50%; top: -14px; width: 12px; height: 30px; margin-left: -6px; border-radius: 2px; background: linear-gradient(90deg, var(--peg), var(--peg-2)); }
      .well { display: grid; place-items: center; height: 150px; background: var(--paper-2); border-radius: 2px; }
      .well img { display: block; height: 44px; width: auto; }
      .hand { position: absolute; left: 0; right: 0; bottom: 8px; font: italic 600 17px/1 "Bradley Hand", "Segoe Print", cursive; color: var(--pencil); }
      h1 { margin: 34px 0 6px; font: 800 40px/0.95 var(--cond); letter-spacing: 0.01em; text-transform: uppercase; }
      h1 i { font-style: normal; color: var(--red); }
      p { margin: 0; color: var(--light-muted); }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 200px; margin-top: 24px; padding: 0 28px; border-radius: 16px; background: var(--red); color: var(--room); font: 800 19px/1 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
      a:hover { background: var(--red-h); }
      a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        .print { animation: sway 5s ease-in-out infinite; transform-origin: 50% -10px; }
        @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(1deg); } }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="edge"><span class="lamp" aria-hidden="true"></span>No signal · Offline</div>
      <div class="line" aria-hidden="true"></div>
      <div class="print" aria-hidden="true">
        <div class="well"><img src="/logo-mark.png" alt="" /></div>
        <span class="hand">nothing developing…</span>
      </div>
      <h1>You are <i>offline</i></h1>
      <p>Event photos needs a connection to show photos.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
